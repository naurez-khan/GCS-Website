<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Staff Login · Department of Mathematics</title>
    <link rel="icon" type="image/png" href="/assets/department-logo.png">


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        body {

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            background: #f3f4f6;

            font-family: Arial, sans-serif;

        }


        .login-container {

            width: 100%;

            max-width: 420px;

            padding: 20px;

        }


        .login-card {

            background: white;

            padding: 35px;

            border-radius: 12px;

            box-shadow:
                0 10px 30px rgba(0, 0, 0, 0.08);

        }


        h1 {

            text-align: center;

            margin-bottom: 10px;

            color: #111827;

        }


        .subtitle {

            text-align: center;

            color: #6b7280;

            margin-bottom: 30px;

        }


        .form-group {

            margin-bottom: 20px;

        }


        label {

            display: block;

            margin-bottom: 7px;

            font-weight: 600;

            color: #374151;

        }


        input {

            width: 100%;

            padding: 12px;

            border: 1px solid #d1d5db;

            border-radius: 7px;

            font-size: 15px;

            outline: none;

        }


        input:focus {

            border-color: #2563eb;

        }


        button {

            width: 100%;

            padding: 12px;

            border: none;

            border-radius: 7px;

            background: #2563eb;

            color: white;

            font-size: 15px;

            font-weight: 600;

            cursor: pointer;

        }


        button:hover {

            background: #1d4ed8;

        }


        button:disabled {

            background: #93c5fd;

            cursor: not-allowed;

        }


        #message {

            margin-top: 20px;

            padding: 12px;

            border-radius: 7px;

            display: none;

            font-size: 14px;

        }


        .success {

            display: block !important;

            background: #dcfce7;

            color: #166534;

        }


        .error {

            display: block !important;

            background: #fee2e2;

            color: #991b1b;

        }


        .test-account {

            margin-top: 25px;

            padding: 15px;

            background: #f9fafb;

            border-radius: 7px;

            font-size: 13px;

            color: #6b7280;

        }


        .test-account strong {

            color: #374151;

        }

    </style>
    <link rel="stylesheet" href="/brand.css?v=20260824-32">
    <script defer src="/ui-icons.js?v=20260824-3"></script>

</head>


<body>


    <div class="login-container">

        <div class="login-card">

            <a class="login-brand" href="/" aria-label="Return to portal home">
                <img class="login-crest" src="/assets/department-logo.png" alt="Department of Mathematics crest">
            </a>

            <h1>
                Welcome back
            </h1>


            <p class="subtitle">
                Sign in to the Department of Mathematics portal
            </p>


            <form id="loginForm">


                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>



                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        required
                    >

                </div>



                <button
                    type="submit"
                    id="loginBtn"
                >
                    Login
                </button>


            </form>



            <div id="message"></div>


            <div class="test-account">
                Are you a student?
                <a href="/results.html">View your published result</a>
            </div>


        </div>

    </div>



    <script>


        // =========================
        // ELEMENTS
        // =========================

        const loginForm =
            document.getElementById(
                "loginForm"
            );


        const emailInput =
            document.getElementById(
                "email"
            );


        const passwordInput =
            document.getElementById(
                "password"
            );


        const loginBtn =
            document.getElementById(
                "loginBtn"
            );


        const message =
            document.getElementById(
                "message"
            );



        // =========================
        // LOGIN
        // =========================

        loginForm.addEventListener(
            "submit",
            async function (event) {

                event.preventDefault();


                const email =
                    emailInput.value.trim();


                const password =
                    passwordInput.value;


                if (!email || !password) {

                    showMessage(
                        "Please enter your email and password.",
                        "error"
                    );

                    return;

                }


                loginBtn.disabled = true;

                loginBtn.textContent =
                    "Logging in...";


                try {


                    const response =
                        await fetch(
                            "/api/auth/login",
                            {

                                method: "POST",

                                headers: {
                                    "Content-Type":
                                        "application/json"
                                },

                                credentials: "include",

                                body: JSON.stringify({
                                    email: email,
                                    password: password
                                })

                            }
                        );


                    const data =
                        await response.json();


                    console.log(
                        "Login response:",
                        data
                    );


                    // =========================
                    // SUCCESS
                    // =========================

                    if (data.success) {


                        // Save logged-in teacher

                        localStorage.setItem(
                            "teacher",
                            JSON.stringify(
                                data.user
                            )
                        );


                        showMessage(
                            "Login successful! Redirecting...",
                            "success"
                        );


                        // Redirect to dashboard

                        setTimeout(
                            function () {

                                window.location.href = data.user.role === "admin"
                                    ? "/admin.html"
                                    : "/teacher-dashboard.html";

                            },
                            500
                        );


                    } else {


                        showMessage(
                            data.message ||
                            "Login failed.",
                            "error"
                        );


                    }


                } catch (error) {


                    console.error(
                        "Login error:",
                        error
                    );


                    showMessage(
                        "Could not connect to the server.",
                        "error"
                    );


                } finally {


                    loginBtn.disabled = false;

                    loginBtn.textContent =
                        "Login";


                }

            }
        );



        // =========================
        // MESSAGE
        // =========================

        function showMessage(
            text,
            type
        ) {

            message.textContent =
                text;

            message.className =
                type;

        }


    </script>


</body>

</html>
